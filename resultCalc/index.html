<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 600px;
        }
        .container{
            width: 350px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px grey;
        }
        h2{
            text-align: center;
            margin-bottom: 20px;
        }
        label{
            font-weight: bold;
        }
        input{
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button{
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        #result{
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Result Calculator</h2>
        <label>Math</label>
        <input type="number" id="s1" min="0" max="100">
        <label>Physics</label>
        <input type="number" id="s2" min="0" max="100">
        <label>DSA</label>
        <input type="number" id="s3" min="0" max="100">
        <label>AI</label>
        <input type="number" id="s4" min="0" max="100">
        <label>English</label>
        <input type="number" id="s5" min="0" max="100">
        <button onclick="calculate()">Calculate Result</button>
        <div id="result"></div>
    </div>
    
    <script>
        function calculate(){
            let s1=Number(document.getElementById("s1").value);
            let s2=Number(document.getElementById("s2").value);
            let s3=Number(document.getElementById("s3").value);
            let s4=Number(document.getElementById("s4").value);
            let s5=Number(document.getElementById("s5").value);

            let total=s1+s2+s3+s4+s5;
            let percentage=total/5;
            let grade;
            let status;

            if(s1<33||s2<33||s3<33||s4<33||s5<<33){
                status="fail";
                grade="F";
            }
            else{
                status="Pass";
                if(percentage>=90){
                     grade="A+";}
                else if(percentage>=80){
                    grade="A";
                }
                else if(percentage>=70){
                    grade="B";
                }
                else if(percentage>60){
                    grade="C";
                }
                else if(percentage>=50){
                    grade="D";
                }
                else{
                    grade="E";
                }
            }
            
            document.getElementById("result").innerHTML='
            Total marks:${total}/500 <br>
            Percentage: ${percentage.toFixed(2)}% <br>'

        }
    </script>
</body>
</html>
