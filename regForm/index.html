<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <form>
    <h1>Registeration Form</h1>
    <hr>
        <label for="">Full Name:</label>
        <input type="text" placeholder="Enter your name">
        <br>
        <label for="">Email:</label>
        <input type="email" placeholder="Enter your email">
        <br>
        <label for="">Password:</label>
        <input type="password" placeholder="Enter your password">
        <label for="">Phone Number:</label>
        <input type="tel" minlength="10" maxlength="10" placeholder="Enter your phone number">
        <br>
        <label for="">Address:</label>
        <textarea name="" id="" rows="7" cols="30"></textarea>
        <br>
        <label for="">Gender:</label>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <input type="radio" name="gender">Other
        <br>
        <label for="">Course:</label>
        <select name="" id="">
                <option value="Select">Select</option>
                <option value="Btech cse">Btech CSE</option>
                <option value="Btech cse ds">Btech CSE(DS)</option>
                <option value="Btech cse (aiml)">Btech CSE(AI ML)</option>
        </select>
        <br>
        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
