<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Event</title>
</head>
<body>
    <button onclick="openWin()">Open New Window</button>
    <script>
        function openWin(){
            //window.open(); -> opens blank window
            // window.open("https://www.google.com/","_parent"); -> opens website in existing window because of "_parent"
            window.open("","", "width=500px,height=500px"); 
        }
    </script>
</body>
</html>
