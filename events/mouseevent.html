<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Events</title>
    <style>
        #box{
            height: 300px;
            width: 300px;
            background-color: palevioletred;
            margin: 200px 0 0 100px;
            border: 15px solid pink;
            border-radius: 5px;
        }
    </style>

    <script>
        function eventcall(){
            alert('Hi');
        }
        function eventcall2(){
            alert('Bye');
        }
        function eventcall3(){
            alert("Double click!?");
        }
        //oncontextmenu=right click
        //onmouseover= hover
        //onmouseout
        //onmouseup
        //onmousedown
    </script>
</head>
<body>
    <div id="box" onmousedown="eventcall()" onmouseup="eventcall2()" ondblclick="eventcall3()">This is section A</div>
</body>
</html>
