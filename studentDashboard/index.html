<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        *{    
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }
        body{
            background:#f2f2f2;
            padding:30px;
        }       

        .container{
            width:90%;
            max-width:1000px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        form{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
            gap:10px;
            margin-bottom:20px;
        }

        input,select,button{
            padding:10px;
            font-size:16px;
            border-radius:5px;
            border:1px solid #ccc;
        }

        button{
            background:#498cd4;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .controls{
            display:flex;
            justify-content:space-between;
            flex-wrap:wrap;
            gap:10px;
            margin-bottom:20px;
        }

        .controls input,
        .controls select{
            width:220px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            padding:12px;
            text-align:center;
            border:1px solid #ddd;
        }

        th{
            background:#498cd4;
            color:white;
        }

        .deleteBtn{
            background:red;
            color:white;
            padding:6px 12px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .deleteBtn:hover{
            background:darkred;
        }

        #norec{
            text-align:center;
            color:red;
            font-size:18px;
            margin-top:20px;
            display:none;
        }

        .total{
            margin:15px 0;
            font-size:18px;
            font-weight:bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <form id="stform">
            <input type="text" id="name" placeholder="Enter your name">
            <input type="number" id="roll" placeholder="Enter your Roll No.">
            <select id="branch">
                <option value="">Select Branch</option>
                <option>CSE</option>
                <option>CSE DS</option>
                <option>CSE AIML</option>
                <option>ECE</option>
                <option>ELCE</option>
                <option>ME</option>
            </select>

            <button type="submit">Add Student</button>
        </form>
        <div class="controls">
            <input type="text" id="search" placeholder="Search by Name">
            <select id="filter">
                <option value="all">All Branches</option>
                <option>CSE</option>
                <option>CSE DS</option>
                <option>CSE AIML</option>
                <option>ECE</option>
                <option>ELCE</option>
                <option>ME</option>
            </select>
        </div>
        <div class="total">
            Total Students:
            <span id="count"></span>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Roll No.</th>
                    <th>Name</th>
                    <th>Branch</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="stTable">

            </tbody>
        </table>
        <div id="norec">No Record Found</div>
    </div>

    <script>
        let students = [];
        const table = document.getElementById("stTable");
        const count = document.getElementById("count");

        function displayStudents() {

            table.innerHTML = "";

            let search = document.getElementById("search").value.toLowerCase();
            let filter = document.getElementById("filter").value;

            let total = 0;

            for (let i = 0; i < students.length; i++) {

                if (
                    students[i].name.toLowerCase().includes(search) &&
                    (filter == "All" || students[i].branch == filter)
                ) {

                    total++;

                    table.innerHTML +=
                    "<tr>" +
                    "<td>" + students[i].roll + "</td>" +
                    "<td>" + students[i].name + "</td>" +
                    "<td>" + students[i].branch + "</td>" +
                    "<td><button onclick='deleteStudent(" + i + ")'>Delete</button></td>" +
                    "</tr>";
                }
            }

            count.innerHTML = total;

            if (total == 0) {
                document.getElementById("norec").style.display = "block";
            } else {
                document.getElementById("norec").style.display = "none";
            }
        }

        document.getElementById("stform").onsubmit = function(e) {

            e.preventDefault();

            let roll = document.getElementById("roll").value;
            let name = document.getElementById("name").value;
            let branch = document.getElementById("branch").value;

            students.push({
                roll: roll,
                name: name,
                branch: branch
            });

            this.reset();
            displayStudents();
        };

        document.getElementById("search").onkeyup = displayStudents;
        document.getElementById("filter").onchange = displayStudents;

        function deleteStudent(index) {
            students.splice(index, 1);
            displayStudents();
        }

        displayStudents();
    </script>

</body>
</html>
